<!doctype html>
<html>
<head><title>考试整卷预览</title></head>
<body>
  <form id="submitTest">
    <input id="testUserRelationId" value="answer-1">
    <input id="enc" value="SAFE_PREVIEW_ENC">
    <input id="encRemainTime" value="3588">
    <input id="remainTime" value="3600">
    <input id="encLastUpdateTime" value="1700000000500">
    <div class="allAnswerList questionWrap singleQuesId ans-cc-exam" data="exam-q-1">
      <input name="questionId" value="exam-q-1">
      <input name="typeexam-q-1" value="0">
      <input id="answerexam-q-1" value="A">
      <div class="tit"><h3>单选题（2.0分）</h3><span>1.</span><p>Choose the first letter.</p></div>
      <div class="answerList radioList" name="A"><cc>A</cc></div>
      <div class="answerList radioList" name="B"><cc>B</cc></div>
    </div>
    <div class="allAnswerList questionWrap singleQuesId ans-cc-exam" data="exam-q-2">
      <input name="questionId" value="exam-q-2">
      <input name="typeexam-q-2" value="3">
      <input id="answerexam-q-2" value="false">
      <div class="tit"><h3>判断题（2.0分）</h3><span>2.</span><p>The hidden answer must not be parsed.</p></div>
    </div>
    <div class="allAnswerList questionWrap singleQuesId ans-cc-exam" data="exam-q-3">
      <input name="questionId" value="exam-q-3">
      <input name="typeexam-q-3" value="11">
      <div class="tit"><h3>连线题（6.0分）</h3><span>3.</span><p>Match each bounded item.</p></div>
    </div>
    <div class="allAnswerList questionWrap singleQuesId ans-cc-exam" data="exam-q-4">
      <input name="questionId" value="exam-q-4">
      <input name="typeexam-q-4" value="15">
      <div class="tit"><h3>阅读理解（10.0分）</h3><span>4.</span><p>Read the sanitized passage.<audio title="sanitized listening prompt"></audio></p></div>
    </div>
  </form>
</body>
</html>
