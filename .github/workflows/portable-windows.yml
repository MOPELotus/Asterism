name: portable-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
            python-architecture: x64
          - architecture: arm64
            runner: windows-11-arm
            python-architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-architecture }}
          cache: pip
      - name: Install build environment
        run: python -m pip install -e ".[desktop,providers,build,dev]"
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:GITHUB_WORKSPACE\.playwright-browsers"
          python -m playwright install chromium
      - name: Run local and worker tests
        shell: pwsh
        run: |
          # The full discovery includes GUI smoke tests; configure Qt before
          # importing any PyQt module so headless Windows runners do not try
          # to load the desktop platform plugin.
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m ruff check src tests packaging workers/common/runtime.py
          python -W error::ResourceWarning -m unittest discover -s tests
          python workers/run_tests.py
          python -m unittest tests.test_gui_smoke -v
      - name: Build portable ZIP
        shell: pwsh
        run: >-
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:GITHUB_WORKSPACE\.playwright-browsers";
          python packaging/build_portable.py
          --architecture ${{ matrix.architecture }}
          --version ${{ github.ref_name }}
      - name: Extract portable ZIP
        shell: pwsh
        run: |
          $archive = Get-ChildItem release\asterism-windows-${{ matrix.architecture }}-*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath 'portable 中文 path'
      - name: Smoke portable package
        run: python packaging/validate_portable.py --require-browser "portable 中文 path"
      - uses: actions/upload-artifact@v4
        with:
          name: asterism-windows-${{ matrix.architecture }}-${{ github.ref_name }}
          path: release/*.zip
          if-no-files-found: error
