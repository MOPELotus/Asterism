name: portable-windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
            python-architecture: x64
          - architecture: arm64
            runner: windows-11-arm
            python-architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-architecture }}
          cache: pip
      - name: Install build environment
        run: python -m pip install -e ".[desktop,providers,build,dev]"
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:GITHUB_WORKSPACE\.playwright-browsers"
          python -m playwright install chromium
      - name: Run local and worker tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-CheckedNative([string] $name, [scriptblock] $command) {
            & $command
            if ($LASTEXITCODE -ne 0) {
              throw "$name failed with exit code $LASTEXITCODE"
            }
          }
          # The full discovery includes GUI smoke tests; configure Qt before
          # importing any PyQt module so headless Windows runners do not try
          # to load the desktop platform plugin.
          $env:QT_QPA_PLATFORM = 'offscreen'
          Invoke-CheckedNative 'ruff' { python -m ruff check src tests packaging workers/common/runtime.py }
          Invoke-CheckedNative 'local tests' { python -W error::ResourceWarning -m unittest discover -s tests }
          Invoke-CheckedNative 'worker tests' { python workers/run_tests.py }
          Invoke-CheckedNative 'GUI smoke tests' { python -m unittest tests.test_gui_smoke -v }
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '[\\/](\.venv|target|build|release)[\\/]' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref] $tokens, [ref] $errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parse error in $($file.FullName): $messages"
            }
          }
          Write-Host "PowerShell parser validation passed for $($files.Count) files"
      - name: Build portable ZIP
        shell: pwsh
        run: >-
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:GITHUB_WORKSPACE\.playwright-browsers";
          python packaging/build_portable.py
          --architecture ${{ matrix.architecture }}
          --version ${{ github.ref_name }}
      - name: Extract portable ZIP into validation paths
        shell: pwsh
        run: |
          $archive = Get-ChildItem release\asterism-windows-${{ matrix.architecture }}-*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath 'portable-ascii-path'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath 'portable 中文 path'
      - name: Smoke portable package in ASCII path
        run: python packaging/validate_portable.py --require-browser "portable-ascii-path"
      - name: Smoke portable package in Chinese path
        run: python packaging/validate_portable.py --require-browser "portable 中文 path"
      - uses: actions/upload-artifact@v4
        with:
          name: asterism-windows-${{ matrix.architecture }}-${{ github.ref_name }}
          path: release/*.zip
          if-no-files-found: error
