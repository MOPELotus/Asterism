name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run generate:api
        working-directory: web
      - run: npm run typecheck:api
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workers/chaoxing/requirements.txt
            workers/welearn/requirements.txt
            workers/uai/requirements.txt
            workers/cidaren/requirements.txt
      - run: python -m pip install -r workers/chaoxing/requirements.txt -r workers/welearn/requirements.txt -r workers/uai/requirements.txt -r workers/cidaren/requirements.txt
      - run: python -m unittest discover -s workers/chaoxing/tests
      - run: python -m unittest discover -s workers/welearn/tests
      - run: python -m unittest discover -s workers/uai/tests
      - run: python -m unittest discover -s workers/cidaren/tests
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm run check
        working-directory: integrations/yunzai-plugin
      - run: npm test
        working-directory: integrations/yunzai-plugin

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Parse installer scripts
        shell: powershell
        run: |
          $files = Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | Where-Object {
            $_.FullName -notmatch '[\\/]node_modules[\\/]' -and $_.FullName -notmatch '[\\/]target[\\/]'
          }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - run: cargo build --release -p asterismd -p asterismctl
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Run Windows installation smoke test
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'Asterism 安装测试'
          $yunzaiRoot = Join-Path $env:RUNNER_TEMP 'Miao Yunzai'
          $passwordFile = Join-Path $env:RUNNER_TEMP 'asterism-bootstrap-password.txt'
          New-Item -ItemType Directory -Force $yunzaiRoot | Out-Null
          New-Item -ItemType Directory -Force $installRoot | Out-Null
          'Asterism-CI-Password-2026!' | Set-Content -LiteralPath $passwordFile -Encoding UTF8
          try {
            $head = (& git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read Git HEAD for build stamp.' }
            $artifactPaths = @(
              (Join-Path $PWD.Path 'target\release\asterismd.exe'),
              (Join-Path $PWD.Path 'target\release\asterismctl.exe'),
              (Join-Path $PWD.Path 'web\dist\index.html')
            )
            $stamp = [ordered]@{
              schema = 1
              profile = 'release'
              builtAtUtc = [DateTime]::UtcNow.ToString('o')
              sourceRoot = $PWD.Path
              gitHead = $head
              cargoLock = (Get-FileHash (Join-Path $PWD.Path 'Cargo.lock') -Algorithm SHA256).Hash.ToLowerInvariant()
              webLock = (Get-FileHash (Join-Path $PWD.Path 'web\package-lock.json') -Algorithm SHA256).Hash.ToLowerInvariant()
              dirty = $false
              artifacts = @($artifactPaths | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant() } })
            }
            $stamp | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $installRoot 'build-stamp.json') -Encoding UTF8
            $installOutput = @(& .\installer\install.ps1 `
              -InstallRoot $installRoot `
              -SourceRoot $PWD.Path `
              -YunzaiRoot $yunzaiRoot `
              -MasterPasswordFile $passwordFile `
              -SkipDependencyInstall `
              -NonInteractive 2>&1)
            $installOutput | Out-Host
            if (($installOutput | Out-String) -notmatch '检测到有效现有构建产物') {
              throw 'Installer did not automatically reuse the matching release build stamp.'
            }
            .\installer\validate.ps1 -InstallRoot $installRoot -SourceRoot $PWD.Path
            $pluginConfig = Join-Path $yunzaiRoot 'plugins\asterism-plugin\config\asterism.json'
            if (-not (Test-Path $pluginConfig)) {
              throw 'Yunzai gateway configuration was not created.'
            }
            $secretHash = (Get-FileHash (Join-Path $installRoot 'secrets.env') -Algorithm SHA256).Hash
            $pluginHash = (Get-FileHash $pluginConfig -Algorithm SHA256).Hash
            .\installer\install.ps1 `
              -InstallRoot $installRoot `
              -SourceRoot $PWD.Path `
              -YunzaiRoot $yunzaiRoot `
              -MasterPasswordFile $passwordFile `
              -SkipDependencyInstall `
              -SkipBuild `
              -NonInteractive
            if ((Get-FileHash (Join-Path $installRoot 'secrets.env') -Algorithm SHA256).Hash -ne $secretHash) {
              throw 'Idempotent rerun replaced secrets.env.'
            }
            if ((Get-FileHash $pluginConfig -Algorithm SHA256).Hash -ne $pluginHash) {
              throw 'Idempotent rerun replaced the Yunzai gateway token/configuration.'
            }
          } finally {
            Get-Process asterismd -ErrorAction SilentlyContinue | Stop-Process -Force
            Remove-Item -LiteralPath $passwordFile -Force -ErrorAction SilentlyContinue
          }
