# Copy this file to asterism.toml and change only the values you need.
# Credentials and other secret values do not belong in this file.

[server]
bind = "127.0.0.1:8068"
session_ttl_seconds = 43200
secure_cookies = false

[database]
url = "sqlite://asterism.db"

[ai]
# Asterism caches every answer candidate locally. This flag only controls
# remote model-provider retention and intentionally remains false.
remote_store = false

[ai.gpt_router]
# Fill in the Responses-compatible GPT router root when it is known.
base_url = ""
api_key_env = "ASTERISM_GPT_ROUTER_API_KEY"
protocol = "responses"

[ai.deepseek]
base_url = "https://api.deepseek.com"
api_key_env = "ASTERISM_DEEPSEEK_API_KEY"
protocol = "chat_completions"

[ai.kimi]
base_url = "https://api.moonshot.cn/v1"
api_key_env = "ASTERISM_KIMI_API_KEY"
protocol = "chat_completions"

[providers]
# Local validation only. These Providers remain unverified and disabled by default.
enable_development_chaoxing = false
enable_development_welearn = false
enable_development_uai = false
enable_development_cidaren = false

[scheduler]
enabled = true
tick_interval_seconds = 5
materialize_limit = 100
claim_limit = 1
# Deployment-wide hard ceiling. Provider and account settings can only reduce it.
execution_concurrency_limit = 32
claim_ttl_seconds = 300
retry_max_attempts = 5
retry_initial_delay_seconds = 30
retry_multiplier = 2
retry_max_delay_seconds = 1800
