# Copy this file to asterism.toml and change only the values you need.
# Credentials and other secret values do not belong in this file.

[server]
bind = "127.0.0.1:8068"
session_ttl_seconds = 43200
secure_cookies = false

[database]
url = "sqlite://asterism.db"

[providers]
# Local validation only. This Provider remains unverified and is disabled by default.
enable_development_chaoxing = false

[scheduler]
enabled = true
tick_interval_seconds = 5
materialize_limit = 100
claim_limit = 1
# Deployment-wide hard ceiling. Provider and account settings can only reduce it.
execution_concurrency_limit = 32
claim_ttl_seconds = 300
retry_max_attempts = 5
retry_initial_delay_seconds = 30
retry_multiplier = 2
retry_max_delay_seconds = 1800
