[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "asterism-desktop"
version = "0.2.0.dev0"
description = "Asterism local desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = [
    "PyQt6>=6.8,<7",
    "PyQt6-Fluent-Widgets>=1.8,<2",
]
providers = [
    "beautifulsoup4>=4.14.2",
    "Brotli>=1.1.0",
    "cryptography>=42.0.0",
    "dataclasses-json>=0.5.7",
    "ddddocr>=1.5.6",
    "fonttools>=4.60.1",
    "httpx>=0.28.1",
    "jsonpath-python>=1.0.6",
    "loguru>=0.7.3",
    "lxml",
    "numpy>=1.24.3",
    "openai>=1.109.1",
    "opencv-python-headless>=4.7.0.72",
    "playwright>=1.55,<2",
    "pyaes>=1.6.1",
    "pycryptodome>=3.15.0",
    "pycryptodomex>=3.23,<4",
    "PyJWT>=2.10,<3",
    "PyYAML>=6.0",
    "requests>=2.32,<3",
    "rich>=12.6.0",
    "spacy>=3.8.7,<4",
    "tenacity>=8.2.0",
    "tqdm>=4.67.1",
    "yarl>=1.9.2",
]
build = [
    "Nuitka>=2.7,<3",
]
dev = [
    "ruff>=0.13,<1",
]

[project.scripts]
asterism = "asterism.cli:main"
asterism-gui = "asterism.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
