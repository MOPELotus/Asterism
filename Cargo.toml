[workspace]
members = [
    "bins/asterism-capture",
    "bins/asterismctl",
    "bins/asterismd",
    "crates/api",
    "crates/auth",
    "crates/config",
    "crates/domain",
    "crates/engine",
    "crates/events",
    "crates/networking",
    "crates/provider-api",
    "crates/scheduler",
    "crates/secrets",
    "crates/storage",
    "providers/cidaren",
    "providers/chaoxing",
    "providers/uai",
    "providers/welearn",
    "providers/upstream-worker",
    "workers/uai/client-rs",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
authors = ["Asterism contributors"]
repository = "https://github.com/MOPELotus/Asterism"

[workspace.dependencies]
anyhow = "1.0.100"
aes = { version = "0.9.2", features = ["zeroize"] }
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
async-trait = "0.1.89"
axum = "0.8.8"
base64 = "0.22.1"
bytes = "1.12.1"
cbc = { version = "0.2.1", features = ["alloc", "zeroize"] }
chrono = { version = "0.4.42", features = ["serde"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
http = "1.4.0"
hmac = "0.12.1"
md5 = "0.8.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
scraper = "0.27.0"
rpassword = "7.5.4"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
thiserror = "2.0.18"
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.4"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["fs", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.19.0", features = ["serde", "v7"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
